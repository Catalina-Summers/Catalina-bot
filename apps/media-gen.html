<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>media generator</title>
<style>
body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;background:#f0f0f0;}
#img{max-width:90vw;max-height:70vh;border:4px solid #333;}
button{margin-top:20px;padding:10px 20px;font-size:16px;cursor:pointer;}
</style>
</head>
<body>
<h2>your generated picture</h2>
<img id="img" src="https://source.unsplash.com/random/800x600" alt="random" />
<button onclick="document.getElementById('img').src='https://source.unsplash.com/random/800x600&'+Date.now()">new picture</button>
</body>
</html>
